apiVersion: v1
kind: ServiceAccount
metadata:
  name: k8s-traffic-exporter
  namespace: monitoring
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: k8s-traffic-exporter
rules:
  - apiGroups: [""]
    resources:
      - pods
      - services
      - nodes
      - namespaces
    verbs: ["get", "list", "watch"]
  - apiGroups: ["apps"]
    resources:
      - deployments
    verbs: ["get", "list", "watch"]
  - apiGroups: ["metrics.k8s.io"]
    resources:
      - pods
      - nodes
    verbs: ["get", "list"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: k8s-traffic-exporter
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: k8s-traffic-exporter
subjects:
  - kind: ServiceAccount
    name: k8s-traffic-exporter
    namespace: monitoring
