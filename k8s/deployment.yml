apiVersion: apps/v1
kind: Deployment
metadata:
  name: k8s-traffic-exporter
  namespace: monitoring
  labels:
    app: k8s-traffic-exporter
spec:
  replicas: 1
  selector:
    matchLabels:
      app: k8s-traffic-exporter
  template:
    metadata:
      labels:
        app: k8s-traffic-exporter
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/port: "9000"
        prometheus.io/path: "/metrics"
    spec:
      serviceAccountName: k8s-traffic-exporter
      containers:
        - name: exporter
          image: k8s-traffic-exporter:latest
          imagePullPolicy: IfNotPresent
          ports:
            - name: metrics
              containerPort: 9000
              protocol: TCP
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 512Mi
          livenessProbe:
            httpGet:
              path: /metrics
              port: metrics
            initialDelaySeconds: 10
            periodSeconds: 10
          readinessProbe:
            httpGet:
              path: /metrics
              port: metrics
            initialDelaySeconds: 5
            periodSeconds: 5
